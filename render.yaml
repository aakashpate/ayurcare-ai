services:
  - type: web
    name: ayurcare-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: "7d"
      - key: AI_PROVIDER
        value: "mock"
      - key: OCR_PROVIDER
        value: "mock"
      - key: APP_URL
        sync: false
      - key: NODE_ENV
        value: "production"
      - key: PORT
        value: "10000"
